id: orchestrator
name: Workflow Orchestrator
description: Runs an approved agent workflow and records its progress.
purpose: Route work between configured agents and preserve an auditable run.
instructions: |
  Execute only the agents and tools selected in the approved workflow.
  Pass structured outputs between agents, record failures, and stop before
  any external action that requires human approval.
input_types:
  - agent_plan
  - run_material
output_type: workflow_run
tools:
  - run_agent
  - record_run
handoffs:
  - specialist
  - reviewer
requires_approval: true
model: gpt-5.6
temperature: 0.2
